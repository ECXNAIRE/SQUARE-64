<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUARE 64</title>
    <style>
        body {
            margin: 0;
            background-color: rgb(19, 19, 19);
            cursor: url("../static/cursor/cursorW.png")8 8, auto;
            transition: background-color 0.5s ease;
        }

        .mainArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0);
            margin-top: 170px;
        }

        .menu {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn {
            height: 50px;
            width: 250px;
            border-radius: 12px;
            font-weight: 700;
            border: 2px solid black;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.08);
            background-color: #55a700;
        }


        .themeToggle {
            position: fixed;
            top: 30px;
            right: 30px;
        }

        .themeToggleLogo {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: 0.5s ease;
        }
    </style>
</head>

<body>
    <div class="themeToggle">
        <img id="themeIcon" class="themeToggleLogo " src="../static/img/lightMode.png">
    </div>


    <div class="mainArea">
        <div class="logo">
            <img src="../static/img/logo.png" alt="logo here">
        </div>

        <div class="menu">
            <button class="btn" onclick="window.location.href='/main'">PLAY</button>
            <button class="btn">ABOUT</button>
        </div>
    </div>


    <script src="../static/js/themeToggleFile.js"></script>
</body>
</html>
