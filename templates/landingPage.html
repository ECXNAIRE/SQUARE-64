<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUARE 64</title>
    <style>
        body {
            margin: 0;
            background-color: rgb(19, 19, 19);
            cursor: url("../static/cursor/cursorW.png")8 8, auto;
            transition: background-color 0.5s ease;
        }

        .mainArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0);
            margin-top: 170px;
        }

        .menu {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn {
            height: 45px;
            width: 270px;
            border-radius: 12px;
            border: 2px solid black;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            position: relative;
            align-items: center;
            padding: 10px;
            justify-content: center;
        }

        .btn:hover {
            transform: scale(1.08);
            background-color: #55a700;
        }


        .themeToggle {
            position: fixed;
            top: 30px;
            right: 30px;
        }

        .themeToggleLogo {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: 0.5s ease;
        }


        .btnLogo {
            position: absolute;
            left: 30px;
            width: 32px;
            height: 32px;
        }

        .btn:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 1;
            background-color: white;
            color: black;
        }

        .btn:disabled:hover {
            transform: none;
        }



        /* NOO NEED TO TOUCH */
        .divider {
            display: flex;
            align-items: center;
            width: 350px;
            margin: 5px 0;
            color: white;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 0.8px;
            background: white;
        }

        .divider.light {
            display: flex;
            align-items: center;
            width: 350px;
            margin: 5px 0;
            color: black;
            letter-spacing: 2px;
        }

        .divider.light::before,
        .divider.light::after {
            content: "";
            flex: 1;
            height: 0.8px;
            background: black;
        }

        .divider span {
            margin: 0 12px;
        }
    </style>
</head>

<body>
    <div class="themeToggle">
        <img id="themeIcon" class="themeToggleLogo " src="../static/img/lightMode.png">
    </div>


    <div class="mainArea">
        <div class="logo">
            <img src="../static/img/logo.png" alt="logo here">
        </div>

        <div class="menu">
            <button class="btn" disabled>
                <img class="btnLogo" src="../static/img/googleLogo.png">GOOGLE LOGIN
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="btn" onclick="window.location.href='/main'">
                <img class="btnLogo" src="../static/img/guestLogo.png">GUEST LOGIN
            </button>
            <button class="btn">ABOUT</button>
        </div>
    </div>


    <script src="../static/js/themeToggleFile.js"></script>
</body>

</html>
