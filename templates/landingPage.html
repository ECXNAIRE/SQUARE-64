<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUARE 64</title>
    <style>
        @font-face {
            font-family: "Chess";
            src: url("../static/fonts/logo.ttf") format("truetype");
        }

        body {
            margin: 0;
            background-color: #F8F8F4;
            transition: background-color 0.5s ease;
            font-style: sans-serif;
        }

        .mainArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0);
            margin-top: 100px;
        }

        .menu {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            height: 45px;
            width: 270px;
            border-radius: 12px;
            border: 2px solid black;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            position: relative;
            align-items: center;
            padding: 10px;
            justify-content: center;
            background: #EBECD0;
        }

        .btn:hover {
            transform: scale(1.08);
            background-color: #739552;
        }




        .btnLogo {
            position: absolute;
            left: 30px;
            width: 32px;
            height: 32px;
        }

        .btn:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 1;
            background-color: #EBECD0;
            color: black;
        }

        .btn:disabled:hover {
            transform: none;
        }



        /* NOO NEED TO TOUCH */
        .divider {
            display: flex;
            align-items: center;
            width: 350px;
            margin: 5px 0;
            color: white;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 0.8px;
            background: white;
        }

        .divider.light {
            display: flex;
            align-items: center;
            width: 350px;
            margin: 5px 0;
            color: black;
            letter-spacing: 2px;
        }

        .divider.light::before,
        .divider.light::after {
            content: "";
            flex: 1;
            height: 0.8px;
            background: black;
        }

        .divider span {
            margin: 0 12px;
        }



        /*POPUP CSS*/
        .popupOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: .25s;
        }

        .popupOverlay.show {
            visibility: visible;
            opacity: 1;
        }

        .popup {
            width: 360px;
            background: #1c1c1c;
            color: white;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #ffffff88;
            text-align: center;
            transform: scale(.95);
            transition: .25s;
            font-family: sans-serif;
        }

        .popupOverlay.show.popup {
            transform: scale(1);
        }

        .popupButtons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .popupBtn {
            width: 140px;
            height: 45px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: .2s;
        }

        .popupBtn:hover {
            transform: scale(1.05);
        }

        #cancelBtn {
            background: #EBECD0;
            color: rgb(0, 0, 0);
        }

        #continueBtn {
            background: #739552;
            color: rgb(0, 0, 0);
        }

        .logo {
            font-family: chess;
            font-weight: bold;
            font-size: 150px;
            color: #EBECD0;
            -webkit-text-stroke: 0.25px black;
        }

        .logo span {
            color: #739552;
            font-size: 220px;
        }

        .footer {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #7a7a7a;
            letter-spacing: 1px;
        }

        .footer a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #7b9f4b;
            
            cursor: pointer;
        }
    </style>
</head>

<body>


    <div class="mainArea">
        <div class="logo">
            SQUARE <span>64</span>
        </div>

        <div class="menu">
            <button class="btn" disabled>
                <img class="btnLogo" src="../static/img/googleLogo.png">GOOGLE LOGIN
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="btn" id="guestLoginBtn">
                <img class="btnLogo" src="../static/img/guestLogo.png">GUEST LOGIN
            </button>
            <button class="btn">ABOUT</button>
        </div>
    </div>



    <div class="popupOverlay" id="guestPopup">
        <div class="popup">
            <h2>CONTINUE AS GUEST ?</h2>

            <p>This session won't be saved. Match history, statistics and saved opponents will not be available.</p>

            <div class="popupButtons">
                <button id="continueBtn" class="popupBtn">CONTINUE</button>
                <button id="cancelBtn" class="popupBtn">CANCEL</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <span>© 2026 SQUARE 64</span>
        <span>•</span>
        <a href="-">Privacy</a>
        <span>•</span>
        <a href="-">Terms</a>
        <span>•</span>
        <a href="#">GitHub</a>
    </footer>

    <script src="../static/js/popupHandle.js"></script>




</body>

</html>
