<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUARE 64</title>
    <style>
        @font-face {
            font-family: "Chess";
            src: url("../static/fonts/logo.ttf") format("truetype");
        }

        body {
            margin: 0;
            background-color: rgb(19, 19, 19);
            cursor: url("../static/cursor/cursorW.png")8 8, auto;
            transition: background-color 0.5s ease;
            font-style: sans-serif;
        }

        .mainArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0);
            margin-top: 100px;
        }

        .menu {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            height: 45px;
            width: 270px;
            border-radius: 12px;
            border: 2px solid black;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            position: relative;
            align-items: center;
            padding: 10px;
            justify-content: center;
        }

        .btn:hover {
            transform: scale(1.08);
            background-color: #55a700;
        }


        .themeToggle {
            position: fixed;
            top: 30px;
            right: 30px;
        }

        .themeToggleLogo {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: 0.5s ease;
        }


        .btnLogo {
            position: absolute;
            left: 30px;
            width: 32px;
            height: 32px;
        }

        .btn:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 1;
            background-color: white;
            color: black;
        }

        .btn:disabled:hover {
            transform: none;
        }



        /* NOO NEED TO TOUCH */
        .divider {
            display: flex;
            align-items: center;
            width: 350px;
            margin: 5px 0;
            color: white;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 0.8px;
            background: white;
        }

        .divider.light {
            display: flex;
            align-items: center;
            width: 350px;
            margin: 5px 0;
            color: black;
            letter-spacing: 2px;
        }

        .divider.light::before,
        .divider.light::after {
            content: "";
            flex: 1;
            height: 0.8px;
            background: black;
        }

        .divider span {
            margin: 0 12px;
        }



        /*POPUP CSS*/
        .popupOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: .25s;
        }

        .popupOverlay.show {
            visibility: visible;
            opacity: 1;
        }

        .popup {
            width: 360px;
            background: #1c1c1c;
            color: white;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #ffffff88;
            text-align: center;
            transform: scale(.95);
            transition: .25s;
        }

        .popupOverlay.show.popup {
            transform: scale(1);
        }

        .popupButtons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .popupBtn {
            width: 140px;
            height: 45px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: .2s;
        }

        .popupBtn:hover {
            transform: scale(1.05);
        }

        #cancelBtn {
            background: #ffffff;
            color: rgb(0, 0, 0);
        }

        #continueBtn {
            background: #55a700;
            color: rgb(0, 0, 0);
        }

        .logo {
            font-family: chess;
            font-weight: bold;
            font-size: 150px;
            color: white;
            -webkit-text-stroke: 0.25px black;
        }

        .logo span {
            color: #55a700;
            font-size: 220px;
        }
    </style>
</head>

<body>
    <div class="themeToggle">
        <img id="themeIcon" class="themeToggleLogo " src="../static/img/lightMode.png">
    </div>


    <div class="mainArea">
        <div class="logo">
            SQUARE <span>64</span>
        </div>

        <div class="menu">
            <button class="btn" disabled>
                <img class="btnLogo" src="../static/img/googleLogo.png">GOOGLE LOGIN
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="btn" id="guestLoginBtn">
                <img class="btnLogo" src="../static/img/guestLogo.png">GUEST LOGIN
            </button>
            <button class="btn">ABOUT</button>
        </div>
    </div>



    <div class="popupOverlay" id="guestPopup">
        <div class="popup">
            <h2>CONTINUE AS GUEST ?</h2>

            <p>This session won't be saved. Match history, statistics and saved opponents will not be available.</p>

            <div class="popupButtons">
                <button id="continueBtn" class="popupBtn">CONTINUE</button>
                <button id="cancelBtn" class="popupBtn">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="../static/js/popupHandle.js"></script>





    <script>
        let darkmode = true;
        const themeIcon = document.getElementById("themeIcon");
        const savedTheme = localStorage.getItem("theme");
        const orDivider = document.querySelector(".divider");

        if (savedTheme === "light") {
            darkmode = false;
        } else {
            darkmode = true;
        }



        function setTheme() {
            if (darkmode == true) {
                localStorage.setItem("theme", "dark")
                document.body.style.backgroundColor = "rgb(19, 19, 19)";
                document.body.style.cursor = "url('../static/cursor/cursorW.png') 8 8, auto";

                themeIcon.src = "../static/img/lightMode.png";
                orDivider.classList.remove("light");
            } else {
                localStorage.setItem("theme", "light")
                document.body.style.backgroundColor = "#F8F8F4";
                document.body.style.cursor = "url('../static/cursor/cursorB.png') 8 8, auto";

                themeIcon.src = "../static/img/darkMode.png";
                orDivider.classList.add("light");
            }
        }

        setTheme();

        themeIcon.addEventListener("click", () => {
            darkmode = !darkmode
            setTheme();
        });

        setTheme();

    </script>

</body>

</html>
