<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUARE 64</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #F8F8F4;
            display: flex;
            flex-direction: column;
            transition: background-color 0.5s ease;
            font-family: sans-serif;
        }

        .topArea {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 30px;
        }


        .mainArea {
            flex: 1;
            display: flex;
            margin: 30px;
            margin-top: 10px;
            margin-bottom: 10px;
            gap: 20px;
        }

        .leftSideBar {
            flex: 0.75;
            border: 0.5px solid rgba(72, 72, 72, 0);
            border-radius: 12px;
        }

        .canvasArea {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #chessBoardCanvas {
            background-color: #F8F8F4;
            border-radius: 12px;
        }

        #chessBoardCanvas:hover {
            cursor: pointer;
        }

        .rightSideBar {
            flex: 1.25;
            border: 2px solid white;
            border: 0.5px solid rgba(72, 72, 72, 0.53);
            border-radius: 12px;
        }

        .themeToggle {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 20px;
        }

        .themeToggleLogo {
            width: 32px;
            height: 32px;
            right: 20px;
            cursor: pointer;
        }

        .backButton {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .backButtonLogo {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .backButtonLogo:hover {
            transform: scale(1.03);
            cursor: pointer;
        }

        .playerData {
            border: 2px solid rgba(0, 0, 0, 0);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 65px;
        }

        .player {
            border: 2px solid black;
            border-radius: 12px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #EBECD0;
            padding: 5px;
        }

        .capturedPieces {
            width: 100%;
            height: 70px;
            border: 2px solid rgba(0, 0, 0, 0);
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }


        .capturedBox {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 6px 0;
        }

        .capturedBox img {
            width: 32px;
            height: 32px;
        }

        .captureBox span {
            margin-top: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        .player h3 {
            margin: 8px 0;
            font-size: 22px;
        }

        .time {
            border: 1px solid #555;
            height: 80px;
            width: 90%;
            border-radius: 12px;
            background-color: white;
        }

        .promotionMenu {
            position: absolute;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 80px;
            background: #B8D97A;
            border: 3px solid #ffffff;
            border-radius: 10px;
            z-index: 1000;
        }

        .promotionMenu img {
            width: 70px;
            height: 70px;
            cursor: pointer;
            padding: 4px;
            transition: 0.15s;
        }

        .promotionMenu img:hover {
            transform: scale(1.08);
        }


        .game-result {
            position: absolute;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            padding: 30px;
            background: #F8F8F4;
            border: 3px solid #739552;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 100;
        }

        .hidden {
            display: none;
        }

        .game-result h1 {
            margin: 0;
            font-size: 32px;
            color: #222;
        }

        .game-result p {
            margin: 0;
            font-size: 18px;
            color: #666;
        }

        .game-result button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: #739552;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .game-result button:hover {
            background: #5e7c45;
        }
    </style>
</head>

<body>
    <div class="mainArea">
        <div class="leftSideBar">
            <div class="backButton">
                <img class="backButtonLogo" src="../static/img/backButton.png" onclick="window.location.href='/'">
            </div>

            <div class="playerData">
                <div class="player" id="playerWhite">
                    <h3>WHITE</h3>

                    <div class="capturedPieces" id="capturedPiecesBlack">
                        <div class="capturedBox">
                            <img src="../static/assets/bQ.svg">
                            <span id="bQ">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/bB.svg">
                            <span id="bB">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/bR.svg">
                            <span id="bR">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/bN.svg">
                            <span id="bN">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/bP.svg">
                            <span id="bP">0</span>
                        </div>
                    </div>



                    <div class="time" id="timeWhite"></div>
                </div>

                <div class="player" id="playerBlack">
                    <h3>BLACK</h3>
                    <div class="capturedPieces" id="capturedPiecesWhite">
                        <div class="capturedBox">
                            <img src="../static/assets/wQ.svg">
                            <span id="wQ">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/wB.svg">
                            <span id="wB">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/wR.svg">
                            <span id="wR">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/wN.svg">
                            <span id="wN">0</span>
                        </div>
                        <div class="capturedBox">
                            <img src="../static/assets/wP.svg">
                            <span ID="wP">0</span>
                        </div>
                    </div>
                    <div class="time" id="timeWhite"></div>
                </div>




            </div>
        </div>

        <div class="canvasArea">
            <canvas id="chessBoardCanvas"></canvas>
            <div id="promotionMenu" class="promotionMenu">
                <img id="promoteQ">
                <img id="promoteR">
                <img id="promoteB">
                <img id="promoteN">
            </div>


            <div id="gameResult" class="game-result hidden">
                <h1 id="resultTitle"></h1>
                <p id="resultText"></p>
                <button id="playAgain">Play Again</button>
            </div>
        </div>

        <div class="rightSideBar">
            <div class="themeToggle">
                <img id="themeIcon" class="themeToggleLogo " src="../static/img/lightMode.png">
            </div>

        </div>
    </div>





    <script type="module" src="../static/js/chessBoard.js"></script>
    <script type="module" src="../static/js/piecesRules.js"></script>





    <script>
        let darkmode = true;
        const themeIcon = document.getElementById("themeIcon");
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "light") {
            darkmode = false;
        } else {
            darkmode = true;
        }



        function setTheme() {
            if (darkmode == true) {
                localStorage.setItem("theme", "dark")
                document.body.style.backgroundColor = "#474f3d";
                document.body.style.cursor = "url('../static/cursor/cursorW.png') 8 8, auto";

                themeIcon.src = "../static/img/lightMode.png";
            } else {
                localStorage.setItem("theme", "light")
                document.body.style.backgroundColor = "#F8F8F4";
                document.body.style.cursor = "url('../static/cursor/cursorB.png') 8 8, auto";

                themeIcon.src = "../static/img/darkMode.png";
            }
        }

        setTheme();

        themeIcon.addEventListener("click", () => {
            darkmode = !darkmode
            setTheme();
        });

        setTheme();

    </script>
</body>

</html>
