<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUARE 64</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: rgb(19, 19, 19);
            display: flex;
            flex-direction: column;
            cursor: url("../static/cursor/cursorW.png")8 8, auto;
            transition: background-color 0.5s ease;
        }

        .topArea {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 30px;
        }

        .navBar {
            flex: 1;
            height: 40px;
            border: .5px solid rgba(255, 255, 255, 0.53);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-radius: 20px;
            margin: 10px;
            margin-left: 10px;
            margin-right: 30px;
            background-color: #55a700;
        }

        .mainArea {
            flex: 1;
            display: flex;
            margin: 30px;
            margin-top: 10px;
            margin-bottom: 10px;
            gap: 20px;
        }

        .leftSideBar {
            flex: 0.75;
            border: 0.5px solid rgba(72, 72, 72, 0.53);
            border-radius: 12px;
        }

        .canvasArea {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chessBoardCanvas {
            background-color: #F8F8F4;
            border-radius: 12px;
        }

        #chessBoardCanvas:hover {
            cursor: pointer;
        }

        .rightSideBar {
            flex: 1.25;
            border: 2px solid white;
            border: 0.5px solid rgba(72, 72, 72, 0.53);
            border-radius: 12px;
        }

        .themeToggle {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 20px;
        }

        .themeToggleLogo {
            width: 32px;
            height: 32px;
            right: 20px;
            cursor: pointer;
        }

        .backButton {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .backButtonLogo {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .backButtonLogo:hover {
            transform: scale(1.03);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="mainArea">
        <div class="leftSideBar">
            <div class="backButton">
                <img class="backButtonLogo" src="../static/img/backButton.png" onclick="window.location.href='/'">
            </div>
        </div>

        <div class="canvasArea">
            <canvas id="chessBoardCanvas"></canvas>
        </div>

        <div class="rightSideBar">
            <div class="themeToggle">
                <img id="themeIcon" class="themeToggleLogo " src="../static/img/lightMode.png">
            </div>

        </div>
    </div>

    
    <script type="module" src="../static/js/chessBoard.js"></script>
    <script type="module" src="../static/js/piecesRules.js"></script>





    //THEME TOGGLE

    <script>
        let darkmode = true;
        const themeIcon = document.getElementById("themeIcon");
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "light") {
            darkmode = false;
        } else {
            darkmode = true;
        }



        function setTheme() {
            if (darkmode == true) {
                localStorage.setItem("theme", "dark")
                document.body.style.backgroundColor = "rgb(19, 19, 19)";
                document.body.style.cursor = "url('../static/cursor/cursorW.png') 8 8, auto";

                themeIcon.src = "../static/img/lightMode.png";
            } else {
                localStorage.setItem("theme", "light")
                document.body.style.backgroundColor = "#F8F8F4";
                document.body.style.cursor = "url('../static/cursor/cursorB.png') 8 8, auto";

                themeIcon.src = "../static/img/darkMode.png";
            }
        }

        setTheme();

        themeIcon.addEventListener("click", () => {
            darkmode = !darkmode
            setTheme();
        });

        setTheme();

    </script>
</body>

</html>
